<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c99bc">
  <meta name="description" content="A juicy 3D packing puzzle. Match colorful cans with their boxes!">
  <title>Bottle Jam 3D · Packing Puzzle</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=dim-4">
</head>
<body>
  <main id="game" aria-label="Bottle Jam 3D game">
    <canvas id="scene" aria-label="3D conveyors with glossy cans and matching cartons"></canvas>

    <header>
      <div class="header-left">
        <button id="settings" class="round" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.7 2.5-2 .9-2.3-.6-2 3.4 1.7 1.8v2.3L2 15l2 3.4 2.3-.6 2 .9L9 21h4l.7-2.3 2-.9 2.3.6 2-3.4-1.7-1.7v-2.4L20 9.1l-2-3.4-2.3.6-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg>
        </button>
        <button id="theme-btn" class="theme-pill" aria-label="Change Theme">
          <span id="theme-icon">🍾</span>
          <span id="theme-name">Bottles</span>
        </button>
      </div>

      <div class="level-badge">
        <small>BOTTLE JAM</small>
        <div class="level-title">Level <span id="level">1</span></div>
      </div>

      <div class="money">
        <i aria-hidden="true">★</i>
        <span id="coins">100</span>
      </div>
    </header>

    <div class="progress-container">
      <div class="progress-track" role="progressbar" aria-label="Level completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progress"></span>
      </div>
      <div id="counter">0 / 24 cans packed</div>
    </div>

    <div id="hint">Tap an open box to pack matching cans!</div>

    <div id="slots-label">
      <div class="slot-pill" id="slots-pill">Slots: <span id="slots-count">0 / 4</span></div>
    </div>

    <div id="box-controls"></div>
    <div id="floating-fx" aria-hidden="true"></div>

    <footer>
      <button id="undo" class="booster-btn" aria-label="Undo last box">
        <strong>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 8 5 14l6 6M6 14h14a7 7 0 0 1 0 14"/></svg>
        </strong>
        <span>Undo</span>
        <small id="undo-count">3</small>
      </button>

      <button id="shuffle" class="booster-btn" aria-label="Shuffle boxes">
        <strong>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h4c7 0 8 16 15 16h3M23 20l4 4-4 4M5 24h4c2 0 4-2 6-5M19 11c2-2 3-3 5-3h3M23 4l4 4-4 4"/></svg>
        </strong>
        <span>Shuffle</span>
        <small id="shuffle-count">3</small>
      </button>

      <button id="extra" class="booster-btn" aria-label="Add waiting slot">
        <strong>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19 6H7a3 3 0 0 0-3 3v18h20V15M4 13h13M24 3v10M19 8h10"/></svg>
        </strong>
        <span>Extra Slot</span>
        <small id="extra-count">1</small>
      </button>
    </footer>

    <div id="toast" role="status"></div>

    <div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <section>
        <div id="modal-icon">📦</div>
        <div id="modal-stars" class="stars-row" style="display:none">
          <span class="star-badge" id="star-1">★</span>
          <span class="star-badge" id="star-2">★</span>
          <span class="star-badge" id="star-3">★</span>
        </div>
        <h1 id="modal-title">Level Complete!</h1>
        <p id="modal-text"></p>
        <div id="modal-actions"></div>
      </section>
    </div>
  </main>

  <script src="vendor/babylon.js"></script>
  <script type="module" src="game.js?v=cans-orientation-fixed"></script>
</body>
</html>
